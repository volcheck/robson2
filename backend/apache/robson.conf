<VirtualHost *:80>
    ServerName robson.local
    DocumentRoot /var/www/robson
    
    # Фронтенд (собранный React)
    <Directory /var/www/robson>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # SPA fallback
        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>
    
    # API (PHP)
    <Directory /var/www/robson/api>
        Options -Indexes
        AllowOverride All
        Require all granted
        
        <FilesMatch \.php$>
            SetHandler application/x-httpd-php
        </FilesMatch>
    </Directory>
    
    # Alias для API
    Alias /api /var/www/robson/api
    
    ErrorLog ${APACHE_LOG_DIR}/robson_error.log
    CustomLog ${APACHE_LOG_DIR}/robson_access.log combined
</VirtualHost>
